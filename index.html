
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeAlpha | Flashcard Quiz App</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f3eaff, #e8e9ff);
    color: #29234b;
    min-height: 100vh;
    padding: 30px 16px;
}

.container {
    max-width: 850px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 28px;
}

header h1 {
    color: #6841ce;
    font-size: 32px;
    margin-bottom: 9px;
}

header p {
    color: #77718d;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.stat {
    background: white;
    padding: 14px 25px;
    border-radius: 14px;
    box-shadow: 0 4px 15px #5940a515;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 23px;
    color: #6841ce;
}

.stat span {
    font-size: 12px;
    color: #777;
}

.categories {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;
    margin-bottom: 20px;
}

.category {
    border: 1px solid #ded4ff;
    background: white;
    color: #6841ce;
    padding: 10px 18px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
}

.category.active,
.category:hover {
    background: #6841ce;
    color: white;
}

.search {
    display: block;
    width: 100%;
    padding: 14px;
    border: 1px solid #ded4ff;
    border-radius: 12px;
    margin-bottom: 22px;
    font-size: 15px;
    outline: none;
}

.search:focus {
    border-color: #6841ce;
}

.flashcard {
    background: white;
    min-height: 270px;
    border-radius: 22px;
    padding: 30px 20px;
    box-shadow: 0 10px 30px #5940a51c;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: transform .3s ease;
}

.flashcard:hover {
    transform: translateY(-3px);
}

.card-top {
    display: flex;
    justify-content: space-between;
    width: 100%;
    color: #777;
    font-size: 13px;
    margin-bottom: 25px;
}

.tag {
    background: #eee8ff;
    color: #6841ce;
    padding: 6px 12px;
    border-radius: 20px;
}

#question {
    font-size: 25px;
    margin: 15px 0 25px;
    line-height: 1.4;
}

#answer {
    display: none;
    color: #6841ce;
    font-size: 19px;
    line-height: 1.5;
    animation: appear .35s ease;
}

@keyframes appear {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}

button {
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    border-radius: 10px;
    padding: 12px 20px;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(.96);
}

.primary {
    background: #6841ce;
    color: white;
}

.light {
    background: #eee8ff;
    color: #6841ce;
}

.orange {
    background: #ffb44c;
    color: #482c08;
}

.red {
    background: #ff6868;
    color: white;
}

.controls,
.actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 17px;
}

.progress {
    width: 100%;
    height: 7px;
    background: #eee8ff;
    border-radius: 20px;
    margin-top: 25px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: #6841ce;
    transition: width .3s;
}

.form-box {
    background: white;
    padding: 25px;
    border-radius: 18px;
    margin-top: 30px;
    box-shadow: 0 5px 20px #5940a510;
}

.form-box h2 {
    color: #6841ce;
    margin-bottom: 18px;
}

.form-box input,
.form-box select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ded4ff;
    border-radius: 9px;
    margin-bottom: 12px;
    font-size: 14px;
    background: white;
}

.form-box button {
    width: 100%;
}

.empty {
    padding: 35px 10px;
    color: #777;
}

footer {
    text-align: center;
    margin-top: 30px;
    color: #827b9c;
    font-size: 13px;
}

@media(max-width: 500px) {
    header h1 {font-size: 25px;}
    #question {font-size: 21px;}
    .stat {padding: 12px 17px;}
    .flashcard {min-height: 250px;}
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>📚 Flashcard Quiz App</h1>
    <p>Learn • Practice • Grow</p>
</header>

<div class="stats">
    <div class="stat">
        <strong id="total">0</strong>
        <span>Total Cards</span>
    </div>
    <div class="stat">
        <strong id="current">0</strong>
        <span>Current Card</span>
    </div>
    <div class="stat">
        <strong id="percentage">0%</strong>
        <span>Progress</span>
    </div>
</div>

<div class="categories">
    <button class="category active" data-category="All">All</button>
    <button class="category" data-category="General">General</button>
    <button class="category" data-category="Technology">Technology</button>
    <button class="category" data-category="Science">Science</button>
    <button class="category" data-category="Math">Math</button>
</div>

<input
    class="search"
    type="text"
    id="search"
    placeholder="🔍 Search flashcards..."
>

<div class="flashcard">

    <div class="card-top">
        <span id="cardNumber">Card 1</span>
        <span class="tag" id="cardCategory">Technology</span>
    </div>

    <h2 id="question">What is HTML?</h2>

    <p id="answer">
        HTML stands for HyperText Markup Language.
    </p>

    <button class="primary" id="showButton" onclick="toggleAnswer()">
        Show Answer
    </button>

    <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
    </div>

</div>

<div class="controls">
    <button class="light" onclick="previousCard()">← Previous</button>
    <button class="primary" onclick="nextCard()">Next →</button>
</div>

<div class="actions">
    <button class="primary" onclick="addCard()">＋ Add</button>
    <button class="orange" onclick="editCard()">✎ Edit</button>
    <button class="red" onclick="deleteCard()">✕ Delete</button>
</div>

<div class="form-box" id="formBox">
    <h2>✨ Add New Flashcard</h2>

    <input
        type="text"
        id="newQuestion"
        placeholder="Enter your question"
    >

    <input
        type="text"
        id="newAnswer"
        placeholder="Enter your answer"
    >

    <select id="newCategory">
        <option value="General">General</option>
        <option value="Technology">Technology</option>
        <option value="Science">Science</option>
        <option value="Math">Math</option>
    </select>

    <button class="primary" onclick="addNewCard()">
        Add Flashcard
    </button>
</div>

<footer>
    Made with ❤️ | CodeAlpha Internship Project
</footer>

</div>

<script>

const defaultCards = [
    {
        question: "What is HTML?",
        answer: "HTML stands for HyperText Markup Language. It creates the structure of web pages.",
        category: "Technology"
    },
    {
        question: "What is CSS?",
        answer: "CSS stands for Cascading Style Sheets. It is used to style web pages.",
        category: "Technology"
    },
    {
        question: "What is JavaScript?",
        answer: "JavaScript is a programming language that makes websites interactive.",
        category: "Technology"
    },
    {
        question: "What is Data Science?",
        answer: "Data Science uses data analysis to discover useful information and insights.",
        category: "Science"
    },
    {
        question: "What is 10 × 5?",
        answer: "The answer is 50.",
        category: "Math"
    },
    {
        question: "What is an ecosystem?",
        answer: "An ecosystem is a community of living organisms interacting with their environment.",
        category: "General"
    }
];

let cards = JSON.parse(localStorage.getItem("flashcards_v2"));

if (!Array.isArray(cards)) {
    cards = defaultCards;
}

let currentIndex = 0;
let selectedCategory = "All";
let searchText = "";
let showingAnswer = false;

function saveCards() {
    localStorage.setItem(
        "flashcards_v2",
        JSON.stringify(cards)
    );
}

function getVisibleCards() {
    return cards
        .map((card, index) => ({...card, originalIndex: index}))
        .filter(card => {
            const matchesCategory =
                selectedCategory === "All" ||
                card.category === selectedCategory;

            const matchesSearch =
                card.question.toLowerCase().includes(searchText) ||
                card.answer.toLowerCase().includes(searchText);

            return matchesCategory && matchesSearch;
        });
}

function displayCard() {

    const visible = getVisibleCards();

    document.getElementById("total").innerText = cards.length;

    if (visible.length === 0) {

        document.getElementById("question").innerText =
            "No flashcards found.";

        document.getElementById("answer").style.display = "none";
        document.getElementById("showButton").style.display = "none";
        document.getElementById("cardNumber").innerText = "0 Cards";
        document.getElementById("cardCategory").innerText = "Empty";
        document.getElementById("current").innerText = "0";
        document.getElementById("percentage").innerText = "0%";
        document.getElementById("progressFill").style.width = "0%";

        return;
    }

    if (currentIndex >= visible.length) {
        currentIndex = 0;
    }

    const card = visible[currentIndex];

    document.getElementById("question").innerText = card.question;
    document.getElementById("answer").innerText = card.answer;
    document.getElementById("cardCategory").innerText = card.category;

    document.getElementById("cardNumber").innerText =
        `Card ${currentIndex + 1} of ${visible.length}`;

    document.getElementById("current").innerText =
        currentIndex + 1;

    const progress = Math.round(
        ((currentIndex + 1) / visible.length) * 100
    );

    document.getElementById("percentage").innerText =
        progress + "%";

    document.getElementById("progressFill").style.width =
        progress + "%";

    document.getElementById("showButton").style.display =
        "inline-block";

    hideAnswer();
}

function toggleAnswer() {
    showingAnswer = !showingAnswer;

    document.getElementById("answer").style.display =
        showingAnswer ? "block" : "none";

    document.getElementById("showButton").innerText =
        showingAnswer ? "Hide Answer" : "Show Answer";
}

function hideAnswer() {
    showingAnswer = false;

    document.getElementById("answer").style.display = "none";
    document.getElementById("showButton").innerText = "Show Answer";
}

function nextCard() {
    const visible = getVisibleCards();

    if (visible.length === 0) return;

    currentIndex = (currentIndex + 1) % visible.length;
    displayCard();
}

function previousCard() {
    const visible = getVisibleCards();

    if (visible.length === 0) return;

    currentIndex =
        (currentIndex - 1 + visible.length) % visible.length;

    displayCard();
}

function addCard() {
    document.getElementById("newQuestion").focus();

    document.getElementById("formBox").scrollIntoView({
        behavior: "smooth"
    });
}

function addNewCard() {

    const question =
        document.getElementById("newQuestion").value.trim();

    const answer =
        document.getElementById("newAnswer").value.trim();

    const category =
        document.getElementById("newCategory").value;

    if (!question || !answer) {
        alert("Please enter both question and answer!");
        return;
    }

    cards.push({
        question: question,
        answer: answer,
        category: category
    });

    saveCards();

    document.getElementById("newQuestion").value = "";
    document.getElementById("newAnswer").value = "";

    selectedCategory = "All";
    searchText = "";
    document.getElementById("search").value = "";

    updateCategoryButtons();

    currentIndex = getVisibleCards().length - 1;

    displayCard();

    alert("Flashcard added successfully!");
}

function editCard() {

    const visible = getVisibleCards();

    if (visible.length === 0) {
        alert("No card available to edit.");
        return;
    }

    const card = visible[currentIndex];
    const index = card.originalIndex;

    const question = prompt(
        "Edit question:",
        cards[index].question
    );

    if (question === null) return;

    const answer = prompt(
        "Edit answer:",
        cards[index].answer
    );

    if (answer === null) return;

    if (!question.trim() || !answer.trim()) {
        alert("Question and answer cannot be empty!");
        return;
    }

    cards[index].question = question.trim();
    cards[index].answer = answer.trim();

    saveCards();
    displayCard();

    alert("Flashcard updated successfully!");
}

function deleteCard() {

    const visible = getVisibleCards();

    if (visible.length === 0) {
        alert("No card available to delete.");
        return;
    }

    const card = visible[currentIndex];

    if (!confirm("Are you sure you want to delete this flashcard?")) {
        return;
    }

    cards.splice(card.originalIndex, 1);

    saveCards();

    currentIndex = Math.max(0, currentIndex - 1);

    displayCard();
}

function updateCategoryButtons() {

    document.querySelectorAll(".category").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.category === selectedCategory
        );
    });
}

document.querySelectorAll(".category").forEach(button => {

    button.addEventListener("click", () => {

        selectedCategory = button.dataset.category;
        currentIndex = 0;

        updateCategoryButtons();
        displayCard();
    });

});

document.getElementById("search").addEventListener(
    "input",
    function() {

        searchText = this.value.trim().toLowerCase();
        currentIndex = 0;

        displayCard();
    }
);

displayCard();

</script>

</body>
</html>
